[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wheel-loader-rl"
version = "0.0.1"
description = "Simulation-only autonomous wheel loader reinforcement learning research scaffold"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=1.26,<3", "PyYAML>=6,<7"]

[project.optional-dependencies]
model-audit = ["xacro==2.1.1"]
sim = ["isaaclab==3.0.0"]
dev = ["pytest>=8,<10"]
geometry-audit = ["matplotlib>=3.8,<4", "Pillow>=10,<13"]
material-audit = ["mujoco==3.12.0", "Pillow>=10,<13"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/test_wa320_mass_budget.py", "tests/test_wa320_static_load.py", "tests/test_wa320_actuators.py", "tests/test_wa320_reconstruction.py", "tests/test_wa320_mechanical_structure.py"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
