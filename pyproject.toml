[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wheel-loader-rl"
version = "0.0.1"
description = "Simulation-only autonomous wheel loader reinforcement learning research scaffold"
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
