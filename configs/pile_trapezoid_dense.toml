# Synthetic loading-bench geometry, not dimensions copied from a paper.
# Starting values for a simulation prototype; not calibrated machine limits.
seed = 42
num_envs = 1
physics_hz = 200
policy_hz = 20
episode_length_s = 5.0

[action_limits]
longitudinal_mps = 1.0
lift_radps = 0.4
curl_radps = 0.6

[pile]
shape = "trapezoid"
slope_deg = 30.0
max_particles = 4096
radius_m = 0.14
spacing_m = 0.29
half_length_m = 3.0
half_width_m = 4.0
height_m = 1.5
particle_density_kgpm3 = 1600.0
# Six-dimensional contacts enable the configured rolling friction.
contact_dimensions = 6
static_friction = 0.65
dynamic_friction = 0.5
rolling_friction = 0.02
center_x_m = 4.0
jitter_m = 0.001
