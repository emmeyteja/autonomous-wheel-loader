sources:
  komatsu_7:
    kind: manufacturer_brochure
    reference: Komatsu WA320-7 CJA00622-06, page 16
    url: https://kcsj.komatsu/-/media/kcsj/contact/download/pdf/construction_machine/wa320-7.pdf?hash=6FE96FE4CD51A0BC96B247F7157CA646&rev=b7bbb016972c43218296faf183be8782
    precision: Published rounding is not physical tolerance.
  aoshima_gap:
    kind: research_report
    reference: Aoshima and Servin, sections 4.1-4.3, Tables 1-2
    url: https://doi.org/10.1007/s11044-024-10005-5
    precision: Quoted nominal machine values are not our own measurements.
  project_assumption:
    kind: unverified_project_input
    reference: configs/vehicle/wa320.yaml
    precision: No measured real-machine error bound.
  diagram_fit:
    kind: manual_diagram_digitization
    reference: configs/geometry/wa320_7_brochure.yaml and wa320_7_bucket.yaml
    precision: Fit residuals and assumed-pick sensitivity are not real-machine accuracy.
  shop_06202:
    kind: manufacturer_shop_manual
    reference: Komatsu SEN06202-03, WA320-7, serial numbers 80001 and up
    sha256: 884e78ca948eeadd273df383fd30c29665632d3e1dfe2e16ee7e7af213008448
    precision: Published reference specifications; applicability to the selected Japanese
      bucket/machine configuration is not established.
    distribution: User-supplied reference; PDF and artwork are not redistributed.
real_machine_measurements:
  available: false
  note: No raw, calibrated, synchronized measurements of the selected machine have
    been supplied. All true vehicle errors are unknown.
