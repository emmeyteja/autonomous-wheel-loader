unavailable:
- verified complete PZ pivot/link and cylinder mounting table for the selected configuration
- confirmation that SEN06202-03 cylinder specifications apply to the selected machine and
  bucket option
- hydraulic chamber time series, valve/flow dynamics, friction and power sharing
- component centres of mass and inertia tensors; allocation of published component weights
  to model bodies
- calibrated tire, slip, friction and material parameters
- calibrated sensor models, mounting survey and timestamp/latency measurements
error_semantics:
  'null': Unknown, never zero or perfect accuracy.
  diagram_residual: Distance to manually picked features or a published dimension in the same
    brochure.
  pick_sensitivity: Conditional variation under assumed pixel/angle perturbations, not confidence
    in true geometry.
  rejected_hypothesis: Retained for audit; not approved as active physical geometry.
