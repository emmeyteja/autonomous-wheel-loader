error_semantics:
  'null': Unknown, never zero or perfect accuracy.
  diagram_residual: Distance to manually picked features or a published dimension
    in the same brochure.
  pick_sensitivity: Conditional variation under assumed pixel/angle perturbations,
    not confidence in true geometry.
  rejected_hypothesis: Retained for audit; not approved as active physical geometry.
