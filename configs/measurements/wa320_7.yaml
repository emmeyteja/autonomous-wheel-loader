unavailable:
- verified complete PZ pivot/link and cylinder mounting table
- lift/tilt/steering cylinder bores, rod diameters, retracted lengths and stroke limits
  for this configuration
- hydraulic chamber pressures, flow/valve characteristics and power sharing
- component mass, centre of mass and inertia measurements
- calibrated tire, slip, friction and material parameters
- calibrated sensor models, mounting survey and timestamp/latency measurements
error_semantics:
  'null': Unknown, never zero or perfect accuracy.
  diagram_residual: Distance to manually picked features or a published dimension
    in the same brochure.
  pick_sensitivity: Conditional variation under assumed pixel/angle perturbations,
    not confidence in true geometry.
  rejected_hypothesis: Retained for audit; not approved as active physical geometry.
